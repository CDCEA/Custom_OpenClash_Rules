# ==================== 分流规则 Rules ====================
# 规则自上而下匹配，命中首条规则后停止。
# no-resolve 用于 IP 类规则，避免为规则匹配额外触发 DNS 解析。
rules:
  - "GEOSITE,private,DIRECT"
  - "GEOIP,private,DIRECT,no-resolve"
  - "RULE-SET,Custom_Direct_Domain,DIRECT"
  - "RULE-SET,Custom_Direct_IP,DIRECT,no-resolve"
  - "RULE-SET,Custom_Direct_Port,DIRECT"
  - "RULE-SET,Custom_Proxy_Domain,Proxies"
  - "RULE-SET,Custom_Proxy_IP,Proxies,no-resolve"
  - "GEOSITE,google-cn,DIRECT"
  - "GEOSITE,category-games@cn,DIRECT"
  - "RULE-SET,Steam_CDN_Domain,DIRECT"
  - "RULE-SET,Steam_CDN_IP,DIRECT,no-resolve"
  - "GEOSITE,category-game-platforms-download,DIRECT"
  - "GEOSITE,category-public-tracker,DIRECT"
  - "GEOSITE,category-communication,社交媒体"
  - "GEOSITE,category-social-media-!cn,社交媒体"
  - "GEOSITE,openai,ChatGPT"
  - "GEOSITE,category-ai-!cn,AI服务"
  # - "GEOSITE,paypa1,Paypa1"
  # - "GEOSITE,wise,Paypa1"
  # - "GEOSITE,irs,Paypa1"
  # - "GEOSITE,olt,Paypa1"
  - "GEOSITE,github,GitHub"
  - "GEOSITE,category-speedtest,测速工具"
  - "GEOSITE,steam,Steam"
  - "GEOSITE,youtube,YouTube"
  - "GEOSITE,apple-tvplus,国外媒体"
  - "GEOSITE,apple,苹果服务"
  - "GEOSITE,microsoft,微软服务"
  - "GEOSITE,googlefcm,谷歌FCM"
  - "GEOSITE,google,谷歌服务"
  - "GEOSITE,tiktok,TikTok"
  - "GEOSITE,netflix,国外媒体"
  - "GEOSITE,disney,国外媒体"
  - "GEOSITE,hbo,国外媒体"
  - "GEOSITE,primevideo,国外媒体"
  - "GEOSITE,category-emby,国外媒体"
  - "GEOSITE,spotify,国外媒体"
  - "GEOSITE,bahamut,Bahamut"
  - "GEOSITE,category-games,游戏平台"
  - "GEOSITE,category-entertainment,国外媒体"
  - "GEOSITE,category-ecommerce,国外电商"
  - "GEOSITE,gfw,Proxies"
  - "GEOIP,telegram,社交媒体,no-resolve"
  - "GEOIP,twitter,社交媒体,no-resolve"
  - "GEOIP,facebook,社交媒体,no-resolve"
  - "GEOIP,google,谷歌服务,no-resolve"
  - "GEOIP,netflix,Netflix,no-resolve"
  - "GEOSITE,cn,DIRECT"
  - "GEOIP,cn,DIRECT,no-resolve"
  - "RULE-SET,Nonstandard_Port_Direct,非标端口"
  - "MATCH,Final"

# ==================== 规则提供者 Rule Providers ====================
# Domain/IP 规则优先使用 MRS；包含端口等复合规则时使用 Classical YAML。
# 更新周期与 Custom_Clash.ini 保持一致：28800 秒（8 小时）。
rule-providers:
  Nonstandard_Port_Direct:
    behavior: classical
    interval: 28800
    type: http
    url: "https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Port_Direct.yaml"
    format: yaml

  Custom_Direct_Domain:
    behavior: domain
    interval: 28800
    type: http
    url: "https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Direct_Domain.mrs"
    format: mrs

  Custom_Direct_IP:
    behavior: ipcidr
    interval: 28800
    type: http
    url: "https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Direct_IP.mrs"
    format: mrs

  Custom_Direct_Port:
    behavior: classical
    interval: 28800
    type: http
    url: "https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Direct_Classical_Port.yaml"
    format: yaml

  Custom_Proxy_Domain:
    behavior: domain
    interval: 28800
    type: http
    url: "https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Proxy_Domain.mrs"
    format: mrs

  Custom_Proxy_IP:
    behavior: ipcidr
    interval: 28800
    type: http
    url: "https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Proxy_IP.mrs"
    format: mrs

  Steam_CDN_Domain:
    behavior: domain
    interval: 28800
    type: http
    url: "https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Steam_CDN_Domain.mrs"
