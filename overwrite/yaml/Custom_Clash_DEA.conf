[General]
# Custom_OpenClash_Rules
# 双订阅按月度流量重置日动态选择
#
# 模块参数：
# EN_KEY1 = 第一条订阅链接
# EN_KEY2 = 第二条订阅链接
# EN_KEY3 = 可选 User-Agent
#
# 默认 User-Agent：
# clash.meta/1.19.20

DOWNLOAD_FILE = url=https://raw.githubusercontent.com/CDCEA/Custom_OpenClash_Rules/refs/heads/main/cfg/yaml/Custom_Clash_DEA.yaml, path=/etc/openclash/config/Custom_Clash.yaml, force=true

CONFIG_FILE = /etc/openclash/config/Custom_Clash_DEA.yaml

# 订阅是在 Overwrite 阶段动态选择的，
# 因此不能在 General 阶段固定为 EN_KEY1。
# SUB_INFO_URL = $EN_KEY1

RESTART = true


[Overwrite]

# ============================================================
# 查询订阅状态
#
# 输出格式：
# 剩余流量字节数 最终到期时间戳
#
# 示例：
# 107374182400 1816012800
#
# 以下情况输出：
# -1 0
#
# 1. 请求失败
# 2. 没有 subscription-userinfo
# 3. 无法取得流量信息
# 4. 订阅已经最终过期
# 5. 剩余流量为 0
# ============================================================

get_sub_status() {
    sub_url="$1"
    sub_ua="${EN_KEY3:-clash.meta/1.19.20}"

    if [ -z "$sub_url" ]; then
        echo "-1 0"
        return
    fi

    headers="$(
        curl -fsSL \
            --connect-timeout 10 \
            --max-time 30 \
            -A "$sub_ua" \
            -D - \
            -o /dev/null \
            "$sub_url" 2>/dev/null
    )"

    if [ $? -ne 0 ] || [ -z "$headers" ]; then
        echo "-1 0"
        return
    fi

    sub_info="$(
        printf '%s\n' "$headers" |
        tr -d '\r' |
        awk '
            tolower($0) ~ /^subscription-userinfo[ \t]*:/ {
                sub(/^[^:]*:[ \t]*/, "")
                value = $0
            }

            END {
                print value
            }
        '
    )"

    if [ -z "$sub_info" ]; then
        echo "-1 0"
        return
    fi

    printf '%s\n' "$sub_info" |
    awk -F';' -v now="$(date +%s)" '
        BEGIN {
            upload = -1
            download = -1
            total = -1
            expire = 0
        }

        {
            for (i = 1; i <= NF; i++) {
                split($i, pair, "=")

                key = tolower(pair[1])
                value = pair[2]

                gsub(/[ \t]/, "", key)
                gsub(/[ \t]/, "", value)

                if (key == "upload") {
                    upload = value + 0
                } else if (key == "download") {
                    download = value + 0
                } else if (key == "total") {
                    total = value + 0
                } else if (key == "expire") {
                    expire = value + 0
                }
            }
        }

        END {
            # 缺少必要流量字段
            if (upload < 0 || download < 0 || total < 0) {
                print "-1 0"
                exit
            }

            # 已经过最终到期时间
            if (expire > 0 && expire <= now) {
                print "-1 0"
                exit
            }

            remain = total - upload - download

            # 流量已经耗尽
            if (remain <= 0) {
                print "-1 0"
                exit
            }

            printf "%.0f %.0f\n", remain, expire
        }
    '
}


# ============================================================
# 计算距离下一次月度流量重置还有多少天
#
# 只提取最终到期时间中的“日”：
#
# 最终到期时间：2027-07-20
# 月度重置日：每月 20 日
#
# 例如：
# 当前日期：2026-09-01
# 下次重置：2026-09-20
# 距离：19 天
#
# 如果重置日为 29、30、31，而当前月份没有该日期，
# 则按当月最后一天计算。
#
# 没有 expire 时输出 999999，使其排在有重置日的订阅后面。
# ============================================================

get_cycle_distance() {
    expire_ts="$1"

    case "$expire_ts" in
        ""|0|*[!0-9]*)
            echo 999999
            return
            ;;
    esac

    # 只使用基础 Ruby，从最终到期时间提取本地日期中的“日”
    reset_day="$(
        ruby -e '
            puts Time.at(ARGV[0].to_i).getlocal.day
        ' "$expire_ts" 2>/dev/null
    )"

    case "$reset_day" in
        ""|*[!0-9]*)
            echo 999999
            return
            ;;
    esac

    # 读取路由器当前年月日
    set -- $(date "+%Y %m %d")

    current_year="$1"
    current_month="$2"
    current_day="$3"

    awk \
        -v year="$current_year" \
        -v month="$current_month" \
        -v today="$current_day" \
        -v reset="$reset_day" '
        function is_leap(y) {
            return (
                y % 400 == 0 ||
                (y % 4 == 0 && y % 100 != 0)
            )
        }

        function days_in_month(y, m) {
            if (m == 2) {
                return 28 + is_leap(y)
            }

            if (
                m == 4 ||
                m == 6 ||
                m == 9 ||
                m == 11
            ) {
                return 30
            }

            return 31
        }

        BEGIN {
            current_month_days =
                days_in_month(year, month)

            current_reset = reset

            # 重置日为 29/30/31，而本月没有该日期时，
            # 使用本月最后一天。
            if (current_reset > current_month_days) {
                current_reset = current_month_days
            }

            # 本月重置日尚未到，或者今天正好是重置日
            if (today <= current_reset) {
                print current_reset - today
                exit
            }

            # 计算下个月
            next_year = year
            next_month = month + 1

            if (next_month > 12) {
                next_month = 1
                next_year++
            }

            next_month_days =
                days_in_month(next_year, next_month)

            next_reset = reset

            if (next_reset > next_month_days) {
                next_reset = next_month_days
            }

            print \
                current_month_days - today + next_reset
        }
    '
}


# ============================================================
# 查询两条订阅
# ============================================================

info_1="$(get_sub_status "$EN_KEY1")"
info_2="$(get_sub_status "$EN_KEY2")"

remain_1="${info_1%% *}"
expire_1="${info_1#* }"

remain_2="${info_2%% *}"
expire_2="${info_2#* }"


# ============================================================
# 计算距离各自下一次月度重置的天数
# ============================================================

cycle_1="$(get_cycle_distance "$expire_1")"
cycle_2="$(get_cycle_distance "$expire_2")"


# ============================================================
# 选择订阅
#
# 优先级：
#
# 1. 有剩余流量且未最终过期
# 2. 距离下一次月度流量重置更近
# 3. 重置距离相同时，剩余流量更多
# 4. 两条都不可用时，回退 EN_KEY1
# ============================================================

selected="$(
    awk \
        -v remain1="$remain_1" \
        -v cycle1="$cycle_1" \
        -v remain2="$remain_2" \
        -v cycle2="$cycle_2" '
        BEGIN {
            usable1 = (remain1 > 0)
            usable2 = (remain2 > 0)

            # 只有订阅一可用
            if (usable1 && !usable2) {
                print 1
                exit
            }

            # 只有订阅二可用
            if (usable2 && !usable1) {
                print 2
                exit
            }

            # 两条都不可用或查询失败
            if (!usable1 && !usable2) {
                print 1
                exit
            }

            # 订阅一距离下一次重置更近
            if (cycle1 < cycle2) {
                print 1
                exit
            }

            # 订阅二距离下一次重置更近
            if (cycle2 < cycle1) {
                print 2
                exit
            }

            # 重置距离相同，选择剩余流量更多的订阅
            if (remain2 > remain1) {
                print 2
            } else {
                print 1
            }
        }
    '
)"


# ============================================================
# 取得最终选择的订阅链接
# ============================================================

if [ "$selected" = "2" ]; then
    selected_url="$EN_KEY2"
else
    selected_url="$EN_KEY1"
fi

# 防止第二条参数为空等异常情况
if [ -z "$selected_url" ]; then
    selected_url="$EN_KEY1"
fi


# ============================================================
# 写入 Custom_Clash.yaml
# ============================================================

ruby_map_edit \
    "$CONFIG_FILE" \
    "['proxy-providers']" \
    "provider1" \
    "['url']" \
    "$selected_url"
